name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' build uv
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from liuyao_mcp import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: python -m liuyao_mcp.ingest
      - run: python -m pytest -q
      - run: python scripts/build_release.py
      - name: Test self-contained archive with uvx
        run: python scripts/smoke_release.py uvx --from "$PWD/dist/liuyao-mcp.tar.gz" liuyao-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
