name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' build uv
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from liuyao_mcp import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: python -m liuyao_mcp.ingest
      - run: python -m pytest -q
      - run: python scripts/build_release.py
      - name: Test self-contained wheel with uvx
        run: python scripts/smoke_release.py uvx --python 3.11 --from "$PWD"/dist/*-py3-none-any.whl liuyao-mcp
      - name: Test cached wheel without network access
        run: python scripts/smoke_release.py uvx --offline --python 3.11 --from "$PWD"/dist/*-py3-none-any.whl liuyao-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Test plugin downloads the published wheel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/liuyao-plugin-cache
        run: python scripts/smoke_release.py --plugin
      - name: Test the same plugin command with network blocked
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/liuyao-plugin-cache
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
          UV_HTTP_TIMEOUT: '2'
          UV_HTTP_RETRIES: '0'
        run: python scripts/smoke_release.py --plugin
