[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liuyao-mcp"
dynamic = ["version"]
description = "Source-grounded Liuyao charts and knowledge retrieval over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0", "lunar-python==1.4.8", "jieba==0.42.1", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
dense = ["transformers>=4.41,<6", "torch>=2.2,<3", "huggingface-hub>=0.23,<2", "numpy>=1.26,<3"]

[project.scripts]
liuyao-mcp = "liuyao_mcp.server:main"
liuyao-ingest = "liuyao_mcp.ingest:main"
liuyao-eval = "liuyao_mcp.evaluate:main"
liuyao-models = "liuyao_mcp.semantic:main"
liuyao-vectors = "liuyao_mcp.vector_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "liuyao_mcp.__version__"}

[tool.setuptools.package-data]
liuyao_mcp = ["_data/knowledge.sqlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
